[package]
name = "matrix-sdk-crypto-wasm"
description = "Matrix encryption library, for JavaScript"
authors = ["Ivan Enderlin <ivane@element.io>"]
edition = "2021"
homepage = "https://github.com/matrix-org/matrix-sdk-crypto-wasm"
keywords = ["matrix", "chat", "messaging", "ruma", "nio"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/matrix-org/matrix-sdk-crypto-wasm"
rust-version = "1.70"
version = "0.0.0"
publish = false

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

################################################################################
#
# Configuration for `wasm-pack`
#
# See https://rustwasm.github.io/docs/wasm-pack/cargo-toml-configuration.html
# for details of what can be set here.
#
################################################################################

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = false

[package.metadata.wasm-pack.profile.profiling.wasm-bindgen]
debug-js-glue = false
demangle-name-section = true
dwarf-debug-info = true

[package.metadata.wasm-pack.profile.release]
# Tell wasm-opt to:
#  * `-Oz`: optimise for size
#
# eggomi fork: upstream also passes `-g`, which keeps the "name" section (the
# printable names for symbols). That section is 2.87 MB of this artifact —
# 38% of the file, and larger than everything except the code itself — and
# nothing at runtime reads it. It exists so that stack traces and CPU profiles
# show `curve25519_dalek::...::mul_base` instead of `wasm-function[2772]`.
#
# We serve this to every signed-in browser, so it is paid for on every cold
# load: 7.48 MB -> 4.61 MB uncompressed, and 1413 KiB -> 1262 KiB over the
# wire at brotli q11. Dropping it costs symbolised production profiles; a
# local `pnpm build:fork` with `-g` restored gets them back for the session
# that needs them, which is the right place to spend the bytes.
wasm-opt = ['-Oz']

################################################################################

[profile.release]
# Tell cargo to run `rustc` with `-Oz` - ie, to optimize for size.
# https://doc.rust-lang.org/cargo/reference/profiles.html#opt-level
opt-level = 'z'
# Use a single codegen-unit to enable better optimizations
codegen-units = 1
# Enable fat link time optimization
lto = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["qrcode"]
qrcode = ["matrix-sdk-crypto/qrcode", "dep:matrix-sdk-qrcode"]

[dependencies]
console_error_panic_hook = "0.1.7"
futures-util = "0.3.27"
# getrandom is not a direct dependency, but we need to enable the "wasm_js" backend.
getrandom = { version = "0.3.0", features = ["wasm_js"] }
http = "1.1.0"
js-sys = "0.3.91"
matrix-sdk-common = { features = ["js",  "experimental-encrypted-state-events"] , git = "https://github.com/matrix-org/matrix-rust-sdk" }
matrix-sdk-indexeddb = { default-features = false, features = ["e2e-encryption"] , git = "https://github.com/matrix-org/matrix-rust-sdk" }
matrix-sdk-qrcode = { optional = true , git = "https://github.com/matrix-org/matrix-rust-sdk" }
rustls-pki-types = { version = "1.15.0", optional = true, default-features = false, features = ["alloc", "web"] }
serde = "1.0.91"
serde_json = "1.0.91"
serde-wasm-bindgen = "0.6.5"
thiserror = "2.0.12"
tracing = { version = "0.1.36", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.14", default-features = false, features = ["registry", "std", "ansi"] }
url = "2.5.0"
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.64"
zeroize = "1.6.0"
wasm-bindgen-test = "0.3.64"

[build-dependencies]
vergen-gitcl = { version = "1.0.0", features = ["build"] }

[dependencies.matrix-sdk-crypto]
default-features = false
features = ["js", "automatic-room-key-forwarding", "experimental-encrypted-state-events", "experimental-push-secrets", "experimental-x509-identity-verification", "rust-x509-verifier-impl"]
git = "https://github.com/matrix-org/matrix-rust-sdk"

[lints.rust]
# Workaround for https://github.com/rustwasm/wasm-bindgen/issues/4283, while we work up the courage to upgrade
# wasm-bindgen
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wasm_bindgen_unstable_test_coverage)'] }

# eggomi fork of matrix-org/matrix-sdk-crypto-wasm (Apache-2.0).
#
# Builds matrix-sdk-crypto from our matrix-rust-sdk fork, which carries one
# change: `get_or_update_sender_data` no longer reruns `SenderDataFinder` for
# every decrypted event on a session whose trust cannot be raised.
#
# Pinned by REVISION, not branch: a branch would make the build depend on
# whatever that branch points at today, and this artifact is shipped prebuilt.
# All four crates are patched together — they are one workspace at one rev, and
# patching a subset duplicates types.
[patch."https://github.com/matrix-org/matrix-rust-sdk"]
matrix-sdk-crypto = { git = "https://github.com/tzarebczan/matrix-rust-sdk", rev = "1cd973eaff2ae131f47ae846abff4704bd389c6c" }
matrix-sdk-common = { git = "https://github.com/tzarebczan/matrix-rust-sdk", rev = "1cd973eaff2ae131f47ae846abff4704bd389c6c" }
matrix-sdk-indexeddb = { git = "https://github.com/tzarebczan/matrix-rust-sdk", rev = "1cd973eaff2ae131f47ae846abff4704bd389c6c" }
matrix-sdk-qrcode = { git = "https://github.com/tzarebczan/matrix-rust-sdk", rev = "1cd973eaff2ae131f47ae846abff4704bd389c6c" }
